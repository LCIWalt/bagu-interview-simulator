name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  analyze-test:
    name: analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Pub get
        run: flutter pub get
      - name: Analyze (zero warnings)
        run: flutter analyze
      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test tool
      - name: Unit + widget tests
        run: flutter test

  build-macos-ios:
    name: build macOS + iOS simulator
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Pub get
        run: flutter pub get
      - name: Disable SPM (CocoaPods path, see docs/ENVIRONMENT.md)
        run: flutter config --no-enable-swift-package-manager
      - name: Build macOS (debug)
        run: flutter build macos --debug
      - name: Build iOS simulator
        run: flutter build ios --simulator --no-codesign

  build-android:
    name: build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Pub get
        run: flutter pub get
      - name: Build APK (debug)
        run: flutter build apk --debug
