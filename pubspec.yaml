name: mockmate
description: "Bagu Interview Simulator（八股文面试模拟助手）— 三端本地优先的 AI 技术面试练习工具。"
publish_to: 'none'

version: 0.1.1+2

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 状态与路由
  flutter_riverpod: ^2.6.1
  go_router: ^16.0.0

  # 数据层
  drift: ^2.28.0
  sqlite3_flutter_libs: ^0.5.30
  path_provider: ^2.1.5
  path: ^1.9.0

  # 网络
  dio: ^5.8.0

  # 平台能力
  flutter_secure_storage: ^9.2.4
  package_info_plus: ^8.3.0

  # 模型与序列化
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # 工具
  collection: ^1.19.0
  crypto: ^3.0.6
  html: ^0.15.6
  archive: ^4.0.0
  pure_zstd: ^1.0.0
  cryptography: ^2.9.0
  intl: ^0.20.2
  yaml: ^3.1.3
  just_audio: ^0.10.6
  flutter_onnxruntime: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.28.0
  freezed: ^3.0.0
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/prompts/
    - assets/models/bge-small-zh-v1.5-quantized.onnx
    - assets/models/bge-tokenizer.json
    - assets/bank_seed/
    - assets/bank_seed/questions/algorithm/algorithm/
    - assets/bank_seed/questions/backend/go/
    - assets/bank_seed/questions/backend/mysql/
    - assets/bank_seed/questions/backend/network/
    - assets/bank_seed/questions/backend/os/
    - assets/bank_seed/questions/backend/redis/
    - assets/bank_seed/questions/frontend/browser/
    - assets/bank_seed/questions/frontend/javascript/
    - assets/bank_seed/questions/frontend/react/
    - assets/bank_seed/questions/mobile/
    - assets/bank_seed/questions/algorithm/general/
    - assets/bank_seed/questions/frontend/general/
    - assets/bank_seed/questions/backend/general/
