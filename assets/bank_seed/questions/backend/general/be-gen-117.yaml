id: be-gen-117
title: "TLS 1.3 的握手过程做了什么优化？0-RTT 有什么风险？"
topics: [network, http, security]
role: backend
level: senior
difficulty: 4
type: knowledge
answer:
  summary: "TLS 1.3 把密钥交换与认证合并到一次往返，客户端在 ClientHello 里带上 key share，服务端直接回复所需参数，因此首次握手只需 1-RTT。会话恢复支持 0-RTT 早数据，但早数据可能被重放，只适合幂等请求。"
  keyPoints:
    - "TLS 1.3 删除了 RSA 静态密钥交换与大量旧套件，只保留前向安全的 (EC)DHE 方案"
    - "ClientHello 携带 key share，服务端可在第一个 flight 完成密钥协商，首次连接 1-RTT"
    - "0-RTT 复用 PSK 提前发送应用数据，但缺少抗重放保证，非幂等操作不应使用"
    - "证书验证仍不可省略，需要校验证书链、主机名与有效期，防止中间人攻击"
  pitfalls:
    - "认为 TLS 1.3 没有握手开销，忽视证书链校验与网络往返"
    - "把 0-RTT 用在支付、下单等非幂等接口，导致请求被重放"
