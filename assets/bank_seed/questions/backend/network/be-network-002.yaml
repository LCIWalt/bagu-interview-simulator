id: be-network-002
title: "HTTP/2 的多路复用解决了什么问题，又留下了什么？"
topics: [network, http, performance]
role: backend
level: senior
difficulty: 3
type: knowledge
answer:
  summary: "HTTP/2 用二进制分帧在一条连接上并发多个 stream，配合 HPACK 压缩头部，消除 HTTP/1.1 的队头阻塞；但 TCP 层丢包仍会阻塞所有 stream。"
  keyPoints:
    - "二进制分帧层与 stream 多路复用"
    - "HPACK 压缩重复头部，降低开销"
    - "一个 TCP 连接承载多个并发请求，减少连接数"
    - "TCP 层丢包仍造成队头阻塞，HTTP/3 改用 QUIC"
  pitfalls: ["认为 HTTP/2 完全没有队头阻塞", "混淆 stream 与 TCP 连接"]
followups:
  - "HTTP/3 为什么基于 UDP？"
source:
