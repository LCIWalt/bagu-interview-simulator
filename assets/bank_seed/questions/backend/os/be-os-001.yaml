id: be-os-001
title: "进程与线程的区别是什么？"
topics: [os, process, thread]
role: backend
level: mid
difficulty: 2
type: knowledge
answer:
  summary: "进程是资源分配单位，拥有独立地址空间；线程是 CPU 调度单位，同进程线程共享地址空间，切换更轻但需要同步。"
  keyPoints:
    - "进程有独立虚拟地址空间与资源"
    - "线程共享进程的堆、代码与打开的文件"
    - "线程切换开销通常小于进程切换"
    - "共享数据需要锁、原子操作或消息传递"
  pitfalls: ["认为线程之间完全独立", "忽略线程共享文件描述符"]
followups:
  - "协程与线程调度的区别是什么？"
