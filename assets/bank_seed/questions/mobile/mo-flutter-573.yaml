id: mo-flutter-573
title: "项目：接手遗留模块，如何先加测试再改？"
topics: [flutter, testing, maintainability]
role: mobile
level: senior
difficulty: 4
type: project
answer:
  summary: "遗留代码往往不可测，第一步不是重构而是 characterization test：先把现有行为（包括怪行为）固化成基线。然后从无依赖的纯逻辑切入，用接缝把 IO 抽到接口后面，每次小步重构后跑基线。这样能在行为不变的前提下逐步改善结构。"
  keyPoints:
    - "先写基线测试锁定现状行为，包括看起来奇怪的逻辑"
    - "从纯函数与数据转换切入，逐步扩展到有依赖的路径"
    - "用接口或注入制造接缝，把 IO 与全局状态替换掉"
    - "每次小步重构后跑基线，小提交便于回滚"
  pitfalls:
    - "先大重构再补测试，无法判断行为是否被改变"
    - "把现有 bug 当正确行为永久固化，且不标注待确认"
