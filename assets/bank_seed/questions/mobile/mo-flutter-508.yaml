id: mo-flutter-508
title: "PlatformView 的圆角、透明与缩放为什么经常不生效？"
topics: [flutter, platform-view, composition]
role: mobile
level: senior
difficulty: 4
type: knowledge
answer:
  summary: "PlatformView 的内容不由 Flutter 的绘制树生成，ClipRRect、Opacity 这类作用于子树的图层效果无法直接裁剪或混合原生层；Hybrid Composition 下 SurfaceView 更是独立合成，父级变换只能部分传递。需要原生侧自己处理形状与透明度，或改用纹理路径并接受其限制。"
  keyPoints:
    - "裁剪与透明依赖 Flutter 图层，PlatformView 的内容不在同一图层里"
    - "Hybrid Composition 的 SurfaceView 由系统合成，父级 clip 与 opacity 不可靠"
    - "TLHC 把内容作为纹理层，可支持部分变换，但仍不等同普通 Widget"
    - "圆角与遮罩尽量在原生 View 上设置，或截图后用 Image 参与 Flutter 合成"
  pitfalls:
    - "给 PlatformView 套 ClipRRect 就以为能裁圆角，真机上仍是直角"
    - "用 AnimatedOpacity 淡入 PlatformView，出现闪黑或直接跳变"
