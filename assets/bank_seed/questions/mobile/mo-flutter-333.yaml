id: mo-flutter-333
title: "从 flutter_driver 迁移到 integration_test 要注意什么？"
topics: [flutter, testing, integration-test]
role: mobile
level: senior
difficulty: 3
type: knowledge
answer:
  summary: "flutter_driver 是宿主进程驱动的旧方案，已由 integration_test 取代。integration_test 在应用进程内运行，直接使用 WidgetTester API，能在真机上验证真实插件与渲染，同时复用现有 Widget 测试写法。"
  keyPoints:
    - "integration_test 与被测应用同进程，可直接访问 Widget 树"
    - "用 flutter test integration_test 在设备或模拟器上执行"
    - "原有 driver 脚本的等待与交互改为 tester 的 finder 与 pump"
    - "截图与性能 trace 可由 IntegrationTestWidgetsFlutterBinding 提供"
  pitfalls:
    - "新用例继续基于 flutter_driver 编写，后续维护成本高"
    - "把 integration_test 混进普通 flutter test，缺少设备时直接失败"
followups:
  - "哪些场景仍然必须依赖宿主侧驱动？"
  - "如何让 integration_test 在 CI 的多台设备上并行？"
