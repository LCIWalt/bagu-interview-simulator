id: mo-flutter-233
title: "Flutter 里如何判断一段计算该不该放进 isolate？"
topics: [flutter, isolate, performance]
role: mobile
level: senior
difficulty: 3
type: knowledge
answer:
  summary: "先看这段计算是否会造成可感知的 UI 卡顿：通常只有几十毫秒以上、且输入输出可发送的纯计算才值得开 isolate。isolate 启动和消息拷贝都有成本，小任务放进 isolate 往往更慢；图片解码、大 JSON 解析、压缩等才适合。"
  keyPoints:
    - "先测量主 isolate 上的耗时，而不是凭感觉拆分"
    - "输入输出必须可发送，避免把 BuildContext、平台对象带进 isolate"
    - "任务越小，isolate 启动与拷贝的固定成本占比越高"
    - "频繁任务应复用 worker isolate，而不是每次 Isolate.run"
  pitfalls:
    - "把很小的字符串处理也丢进 isolate，反而增加延迟"
    - "在 isolate 中访问 UI、插件或全局可变状态"
followups:
  - "如何衡量 isolate 方案是否真的降低了 jank？"
