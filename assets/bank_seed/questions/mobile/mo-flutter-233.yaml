id: mo-flutter-233
title: "Isolate.run 与 compute 该如何选？"
topics: [flutter, isolate, performance]
role: mobile
level: senior
difficulty: 3
type: knowledge
answer:
  summary: "Isolate.run 接收一个无参闭包并在新 isolate 中执行，结果通过 Future 返回，适合一次性、需要捕获多个变量的任务。compute 要求顶层或静态函数、只能传一个参数，但属于 Flutter foundation，在 Web 上有降级行为。两者都是一次性 isolate，常驻任务应改用 Isolate.spawn。"
  keyPoints:
    - "Isolate.run 支持闭包，捕获的变量会被复制到新 isolate"
    - "compute 只能传单个参数，需自行打包成 record 或类"
    - "两者都在任务结束后销毁 isolate，频繁调用有启动开销"
    - "长生命周期或需要双向通信时用 Isolate.spawn 加 SendPort"
  pitfalls:
    - "在 Isolate.run 的闭包里捕获 BuildContext 或超大对象"
    - "对很小的计算也开 isolate，启动成本高于计算本身"
followups:
  - "什么时候应该复用同一个 worker isolate？"
