id: mo-dart-065
title: "Stream 的 onError、cancelOnError 与 onDone 边界"
topics: [dart, stream, error-handling]
role: mobile
level: mid
difficulty: 3
type: knowledge
answer:
  summary: "listen 的 onError 处理流内错误，cancelOnError 为 true 时会在首个错误后自动取消订阅，否则流可能继续派发。onDone 只在流正常关闭时调用，因错误取消时不保证触发。错误处理要明确这条流是“遇错即停”还是“跳过继续”。"
  keyPoints:
    - "onError 可接收 error 与 stackTrace 两个参数"
    - "cancelOnError 默认为 false，出错后流可能继续"
    - "onDone 只在正常 close 时触发"
    - "未提供 onError 时错误进入 Zone 的未捕获处理"
  pitfalls:
    - "以为 onDone 一定会在错误后执行"
    - "忽略 cancelOnError，错误后继续处理脏数据"
followups:
  - "如何让流在错误后重试而不是直接终止？"
  - "onError 中重新抛出错误会发生什么？"
