id: mo-flutter-291
title: "后台 isolate 里直接调用 MethodChannel 为什么会失败？"
topics: [flutter, isolates, platform-channel]
role: mobile
level: senior
difficulty: 4
type: knowledge
answer:
  summary: "平台通道绑定到创建它的 BinaryMessenger，默认只在根 isolate 可用；后台 isolate 没有引擎的 messenger，直接调用 MethodChannel 会失败或收不到回复。需要在后台 isolate 中用根 isolate 的 token 初始化 BackgroundIsolateBinaryMessenger，或把调用转回主 isolate。"
  keyPoints:
    - "每个 isolate 有独立堆，通道 handler 与 messenger 不会自动共享"
    - "用 RootIsolateToken.instance 获取 token 并传给后台 isolate"
    - "调用 BackgroundIsolateBinaryMessenger.ensureInitialized 后才能 invokeMethod"
    - "插件未必支持后台 isolate，使用前要验证其线程假设"
  pitfalls:
    - "在 isolate 入口直接调用插件，抛 MissingPluginException"
    - "把不可发送的对象传给 isolate，spawn 直接失败"
followups:
  - "Isolate.run 与 compute 应该如何选择？"
  - "后台 isolate 的生命周期由谁管理？"
