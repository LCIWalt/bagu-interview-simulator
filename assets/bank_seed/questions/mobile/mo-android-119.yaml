id: mo-android-119
title: "Android: DiffUtil 与列表局部刷新"
topics: [android, recyclerview, performance]
role: mobile
level: mid
difficulty: 3
type: knowledge
answer:
  summary: "DiffUtil 比较新旧列表并计算最小更新集，配合 ListAdapter 可以只刷新变化的 item。areItemsTheSame 决定是否是同一个对象，areContentsTheSame 决定内容是否变化，二者实现错误会导致闪烁、错位或点击状态丢失。"
  keyPoints:
    - "areItemsTheSame 使用稳定唯一 id，areContentsTheSame 比较展示字段"
    - "DiffUtil 最坏复杂度为 O(N²)，大列表应在后台线程计算"
    - "payload 可以只更新局部视图，减少闪烁和重绑成本"
    - "提交新列表必须使用新实例，不能原地修改同一个 List"
  pitfalls:
    - "areItemsTheSame 永远返回 false，导致所有 item 全量重建"
    - "在主线程对大列表调用 DiffUtil.calculateDiff"
followups:
  - "AsyncListDiffer 与 ListAdapter 如何避免旧 diff 结果覆盖新列表？"
