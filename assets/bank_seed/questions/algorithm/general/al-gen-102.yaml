id: al-gen-102
title: "搜索旋转排序数组（二分）"
body: "一个升序数组在某个未知下标处被旋转，例如 [0,1,2,4,5,6,7] 变成 [4,5,6,7,0,1,2]。给定元素互不相同的数组 nums 和目标值 target，返回 target 的下标，不存在则返回 -1。要求时间复杂度 O(log n)。"
topics: [algorithm, binary-search, array]
role: algorithm
level: mid
difficulty: 3
type: coding
answer:
  summary: "旋转数组二分的核心是每轮用 nums[mid] 与 nums[lo] 比较，判断左半段还是右半段有序，再看 target 是否落在有序区间内，从而把搜索范围缩小一半。时间 O(log n)，空间 O(1)。"
  keyPoints:
    - "每轮先判断 [lo, mid] 还是 [mid, hi] 有序，依据是 nums[lo] <= nums[mid]"
    - "target 落在有序半区内则收缩到该半区，否则去另一半；循环条件用 lo <= hi"
    - "时间 O(log n)，空间 O(1)，只读数组无需额外结构"
    - "边界：空数组返回 -1，单元素、数组未旋转、target 位于旋转点两侧都要覆盖"
  pitfalls:
    - "只比较 nums[mid] 与 target 而不先判断哪半有序，在旋转点附近会进入错误分支"
    - "循环写成 lo < hi 或更新边界时漏掉 mid，导致死循环或漏查最后一个元素"
followups:
  - "数组含重复元素时（如 [1,3,1,1,1]）二分还成立吗？需要怎样退化处理？"
  - "如何用二分找到旋转点，也就是数组最小值的下标？"
